<!DOCTYPE html>
<html lang="fr">
<head> 
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulaire d'inscription</title>
</head>

<body>
    <div class="container">
      <div class="form-section">

          <h1>Ready to start your success story ?</h1>
          <h2>Signup to our website and start leafing through your favorite literature today !</h2>  
          
          <form action="/submit_form" method="post">
          <label for="nom"> Full Name :</label>
          <input type="text" id="nom" name="nom" placeholder="Your name here"> 
          
          <label for="email"> Email :</label>
          
          <input type="text" id="email" name="email" placeholder="Your email here" required>
        
          <label for="interest"> Area of interest : </label>
          
          <input type="text" id="interest" name="interest" placeholder="Your area of interest here" required>
          

          <div>
            <input type="checkbox" id="terms"> 
            <label for="terms">I agree to the terms and conditions</label>
          </div>
        
          <button type="submit">Sign Up</button>
          </form>
        </div>
     
        <div class="section-image">
            <img src="images/miss-book.png" alt="illustration-image" width="400" height="300"> 
        </div>
    </div>
